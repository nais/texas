[settings]
pin = true

[tools]
rust = { version = "1.99.1", components = "rustfmt,clippy" }
cargo-binstall = "1.24.0"
"aqua:sethvargo/ratchet" = "0.12.0"
"cargo:cargo-audit" = "0.22.2"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-outdated" = "0.19.0"
"cargo:cargo-nextest" = "0.9.146"

[tasks."build"]
description = "Build the release binary"
run = "cargo build --release"

[tasks."local"]
description = "Run texas locally with debug logging"
depends = ["compose"]
env = { RUST_LOG = "info,texas=debug" }
run = "cargo run --features local"

[tasks."compose"]
description = "Start the mock OAuth server and OpenTelemetry stack"
depends = ["setup"]
run = "docker compose up -d"

[tasks."setup"]
description = "Create .env from .env.example if missing, and the mock OAuth server config"
run = '''
{% set client_jwk = read_json(path='tests/fixtures/client-auth-rsa-private.jwk') | json_encode %}
if [ ! -f .env ]; then
  cp -v .env.example .env
  cat >> .env <<'EOF'

MASKINPORTEN_CLIENT_JWK='{{ client_jwk }}'
AZURE_APP_JWK='{{ client_jwk }}'
TOKEN_X_PRIVATE_JWK='{{ client_jwk }}'
EOF
fi
mkdir -p .local
{% set idp_jwk = read_file(path='tests/fixtures/rsa-private.jwk') %}
{% set key_provider = { "initialKeys": idp_jwk, "algorithm": "RS256" } %}
{% set mock_config = { "tokenProvider": { "keyProvider": key_provider } } %}
cat > .local/mock-oauth2-server.json <<'EOF'
{{ mock_config | json_encode(pretty=true) }}
EOF
'''

[tasks."check"]
description = "Run all static analysis tools and tests"
depends = ['check:*', 'test']

[tasks."check:clippy"]
description = "Run clippy"
# Together, these runs cover the default, all-feature, and non-local Docker configurations.
run = [
    "cargo clippy --all-targets -- -D warnings",
    "cargo clippy --all-targets --all-features -- -D warnings",
    "cargo clippy --all-targets --features docker,openapi -- -D warnings",
]

[tasks."check:fmt"]
description = "Check formatting"
run = "cargo fmt --check"

[tasks."check:actions"]
description = "Check for unpinned GitHub Actions"
run = "ratchet lint .github/workflows/*.yaml"

[tasks."check:openapi"]
description = "Verify the OpenAPI spec is up-to-date"
depends = ['openapi']
run = '''
if ! git diff --exit-code --name-only -- doc/openapi-spec.json; then
  echo "::error::openapi spec is not up-to-date; run \`mise run openapi\` and commit the changes"
  exit 1
fi
'''

[tasks."fmt"]
description = "Format code"
run = "cargo fmt"

[tasks."security"]
description = "Run security audits"
depends = ['security:*']

[tasks."security:audit"]
description = "Run cargo audit"
run = "cargo audit"

[tasks."security:deny"]
description = "Run cargo deny"
run = "cargo deny check -s --hide-inclusion-graph"

[tasks."security:outdated"]
description = "Check for outdated dependencies"
run = "cargo outdated --root-deps-only"

[tasks."test"]
description = "Run tests"
run = "cargo nextest run --locked --features docker"

[tasks."test:roundtrip"]
description = "Run all roundtrip integration scripts"
run = [
    "./hack/roundtrip-azure-cc.sh",
    "./hack/roundtrip-azure-obo.sh",
    "./hack/roundtrip-idporten.sh",
    "./hack/roundtrip-ansattporten.sh",
    "./hack/roundtrip-maskinporten.sh",
    "./hack/roundtrip-maskinporten-rar.sh",
    "./hack/roundtrip-tokenx.sh",
]

[tasks."openapi"]
description = "Generate the OpenAPI spec"
run = "cargo run --bin gen-openapi > doc/openapi-spec.json"

[tasks."actions:update"]
description = "Upgrade all GitHub actions to the latest version satisfying their version tag"
run = "ratchet update .github/workflows/*.yaml"

[tasks."actions:upgrade"]
description = "Upgrade all GitHub actions to the latest version"
run = "ratchet upgrade .github/workflows/*.yaml"
