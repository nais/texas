services:
  otel:
    image: grafana/otel-lgtm:latest
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
  oauth-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4
    ports:
      - "8080:8080"
    environment:
      JSON_CONFIG_PATH: /config/mock-oauth2-server.json
    volumes:
      # Generated by `mise run setup` from tests/fixtures/rsa-private.jwk.
      - ./.local/mock-oauth2-server.json:/config/mock-oauth2-server.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/maskinporten/.well-known/openid-configuration"]
      interval: 1s
      timeout: 2s
      retries: 30
